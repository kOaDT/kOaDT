name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Generate header.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kOaDT
          template: classic
          base: header
          config_timezone: Europe/Paris
          plugin_introduction: yes
          plugin_introduction_title: yes
          filename: header.svg

      - name: Copy generated SVGs to workspace
        run: |
          if [ -d /metrics_renders ]; then
            cp -v /metrics_renders/*.svg . 2>/dev/null || sudo cp -v /metrics_renders/*.svg .
          fi
          ls -la *.svg 2>/dev/null || echo "No SVG files found"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add header.svg
          git diff --staged --quiet || (
            git commit -m "chore: update metrics [skip ci]"
            git pull --rebase origin main
            git push origin main
          )
