name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Generate header.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kOaDT
          template: classic
          base: header
          config_timezone: Europe/Paris
          plugin_introduction: yes
          plugin_introduction_title: yes
          filename: header.svg

      - name: Generate github-stats.svg (stats card)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kOaDT
          template: classic
          base: ""
          config_timezone: Europe/Paris
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: no
          filename: github-stats.svg

      - name: Generate stargazers.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kOaDT
          template: classic
          base: ""
          config_timezone: Europe/Paris
          plugin_stargazers: yes
          plugin_stargazers_charts_type: classic
          filename: stargazers.svg

      - name: Generate topics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kOaDT
          template: classic
          base: ""
          config_timezone: Europe/Paris
          plugin_topics: yes
          plugin_topics_mode: starred
          plugin_topics_limit: 0
          filename: topics.svg

      - name: Generate languages.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kOaDT
          template: classic
          base: ""
          config_timezone: Europe/Paris
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          filename: languages.svg

      - name: Generate github-metrics.svg (combined stats)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kOaDT
          template: classic
          base: ""
          config_timezone: Europe/Paris
          config_order: stargazers, languages, topics
          plugin_stargazers: yes
          plugin_stargazers_charts_type: classic
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_topics: yes
          plugin_topics_mode: starred
          plugin_topics_limit: 0
          filename: github-metrics.svg

      - name: Copy generated SVGs to workspace
        run: |
          if [ -d /metrics_renders ]; then
            cp -v /metrics_renders/*.svg . 2>/dev/null || sudo cp -v /metrics_renders/*.svg .
          fi
          ls -la *.svg 2>/dev/null || echo "No SVG files found"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg
          git diff --staged --quiet || (
            git commit -m "chore: update metrics [skip ci]"
            git pull --rebase origin main
            git push origin main
          )
