name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  header:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kOaDT
          template: classic
          base: header
          config_timezone: Europe/Paris
          plugin_introduction: yes
          plugin_introduction_title: yes
          filename: header.svg

  stargazers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kOaDT
          template: classic
          base: ""
          config_timezone: Europe/Paris
          plugin_stargazers: yes
          plugin_stargazers_charts_type: classic
          filename: stargazers.svg

  topics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kOaDT
          template: classic
          base: ""
          config_timezone: Europe/Paris
          plugin_topics: yes
          plugin_topics_mode: starred
          plugin_topics_limit: 0
          filename: topics.svg

  habits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kOaDT
          template: classic
          base: ""
          config_timezone: Europe/Paris
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14
          plugin_habits_from: 200
          filename: habits.svg

  isocalendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: kOaDT
          template: classic
          base: ""
          config_timezone: Europe/Paris
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: isocalendar.svg
